# ca65/ld65 configuration for sixfiveohtwo smoke tests.
#
# Produces a full 64K image; CODE is placed at $0200.
# The testbench writes the reset vector ($0200) into $FFFC/$FFFD.

MEMORY {
    RAM: start = $0000, size = $10000, file = %O, fill = yes;
}

SEGMENTS {
    CODE: load = RAM, offset = $0200;
}